name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --disable-pip-version-check -e . pytest ruff

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

      - name: CLI smoke test
        run: |
          taskfm --version
          taskfm vibe "fix the flaky websocket reconnect bug"
          taskfm vibe "update the readme"
          taskfm vibe --json "deploy the service with docker"
